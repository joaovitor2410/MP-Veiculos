<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Login — Painel Admin MP Veículos</title>
<link rel="icon" type="image/png" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="admin-login-body">

<section class="admin-login">
  <form id="loginForm" class="admin-login-card">
    <img class="admin-login-logo" src="/assets/logo.png" alt="Logo MP Veículos">
    <p class="admin-login-sub">Painel administrativo</p>
    <div class="field">
      <label for="loginEmail">E-mail</label>
      <input type="email" id="loginEmail" required autocomplete="username">
    </div>
    <div class="field">
      <label for="loginSenha">Senha</label>
      <input type="password" id="loginSenha" required autocomplete="current-password">
    </div>
    <div id="loginError" class="admin-error" hidden></div>
    <button type="submit" id="btnEntrar" class="btn btn-primary admin-full">Entrar</button>
    <a class="admin-back-site" href="/index.html">‹ Voltar para o site</a>
  </form>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/admin/js/common.js"></script>
<script src="/admin/js/login.js"></script>
</body>
</html>
